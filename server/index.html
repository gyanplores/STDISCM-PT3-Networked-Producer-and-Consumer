<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Media Upload Consumer GUI</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 1.5rem; }
    .badge { background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #1e293b; border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid #334155; transition: transform 0.15s, border-color 0.15s; }
    .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
    .video-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
    .video-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pill { position: absolute; top: 8px; right: 8px; background: rgba(15, 23, 42, 0.85); color: #38bdf8; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; pointer-events: none; }
    .meta { padding: 12px 14px; font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); align-items: center; justify-content: center; z-index: 50; }
    #modal.open { display: flex; }
    .modal-content { background: #1e293b; padding: 16px; border-radius: 12px; max-width: 900px; width: 92%; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .close-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #fullPlayer { width: 100%; max-height: 75vh; background: #000; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Uploaded Media Gallery</h1>
    <span class="badge" id="statusBadge">Loading...</span>
  </header>

  <div class="grid" id="gallery"></div>

  <div id="modal" onclick="if(event.target === this) closeModal()">
    <div class="modal-content">
      <div class="modal-header">
        <strong id="modalTitle">Video</strong>
        <button class="close-btn" onclick="closeModal()">Close</button>
      </div>
      <video id="fullPlayer" controls autoplay></video>
    </div>
  </div>

  <script>
    let knownFiles = new Set();

    async function refreshVideos() {
      try {
        const res = await fetch('/api/videos');
        const videos = await res.json();
        document.getElementById('statusBadge').textContent = `${videos.length} video(s) processed`;

        const gallery = document.getElementById('gallery');
        for (const name of videos) {
          if (knownFiles.has(name)) continue;
          knownFiles.add(name);

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="video-box">
              <video src="/previews/preview_${encodeURIComponent(name)}.mp4" muted loop preload="metadata"></video>
              <span class="pill">Hover: 10s Preview</span>
            </div>
            <div class="meta" title="${name}">${name}</div>
          `;

          const vid = card.querySelector('video');
          const pill = card.querySelector('.pill');

          // 10-second preview on mouse hover
          card.addEventListener('mouseenter', () => {
            vid.currentTime = 0;
            vid.play().catch(() => {});
            pill.textContent = 'Previewing (10s)...';
          });
          card.addEventListener('mouseleave', () => {
            vid.pause();
            vid.currentTime = 0;
            pill.textContent = 'Hover: 10s Preview';
          });

          // Full video on click
          card.addEventListener('click', () => openModal(name));
          gallery.appendChild(card);
        }
      } catch (err) {
        document.getElementById('statusBadge').textContent = 'Disconnected';
      }
    }

    function openModal(filename) {
      const modal = document.getElementById('modal');
      const player = document.getElementById('fullPlayer');
      document.getElementById('modalTitle').textContent = filename;
      player.src = `/uploads/${encodeURIComponent(filename)}`;
      modal.classList.add('open');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      const player = document.getElementById('fullPlayer');
      player.pause();
      player.src = '';
      modal.classList.remove('open');
    }

    refreshVideos();
    setInterval(refreshVideos, 2000);
  </script>
</body>
</html>
