syntax = "proto3";

package mediaupload;

// Client-streaming upload: the producer sends one FileMeta message first,
// followed by any number of data chunks. The consumer answers once, after the
// stream ends -- or immediately after FileMeta if the queue is full.
service MediaUpload {
  rpc Upload(stream UploadChunk) returns (UploadResult);
}

message UploadChunk {
  oneof payload {
    FileMeta meta = 1;  // always the first message of a stream
    bytes data = 2;     // every following message
  }
}

message FileMeta {
  string filename    = 1;  // original file name, e.g. "clip01.mp4"
  uint64 size_bytes  = 2;  // total size, so the consumer can sanity-check
  string producer_id = 3;  // which producer thread sent it, e.g. "producer-2"
  string sha256      = 4;  // BONUS (duplicate detection): empty for now
}

enum Status {
  ACCEPTED           = 0;
  DROPPED_QUEUE_FULL = 1;  // leaky bucket: no free slot, video discarded
  ERROR              = 2;
}

message UploadResult {
  Status status  = 1;
  string message = 2;  // human-readable detail for logs
}
